<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ООП Модальное окно</title>
    <link rel="stylesheet" href="fr.css">
</head>
<body>

    <button id="openBtn">Открыть окно</button>

    <dialog id="myDialog" class="modal">
        <div class="modal__content">
            <h2>Успешное действие!</h2>
            <p>Это модальное окно переписано с использованием объектно-ориентированного подхода (ООП). Оно инкапсулирует логику внутри класса.</p>
            <button class="modal__close-btn">Закрыть</button>
        </div>
    </dialog>

    <script src="fr.js"></script>
</body>
</html>
